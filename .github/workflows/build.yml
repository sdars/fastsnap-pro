name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and self-test
        run: ./gradlew --no-daemon clean build selftest
      - name: Python reference cross-check
        run: python3 scripts/test_reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: fastsnap-pro-3.2.1
          path: |
            build/libs/*.jar
            build/distributions/*
