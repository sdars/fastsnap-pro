name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and self-test
        run: ./gradlew --no-daemon clean build selftest
      - name: Python reference cross-check
        run: python3 scripts/test_reference.py
      - name: Checksums
        run: |
          cd build/libs
          sha256sum *.jar > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            build/libs/SHA256SUMS
            build/distributions/*.zip
            build/distributions/*.tar
          generate_release_notes: true
          fail_on_unmatched_files: true
